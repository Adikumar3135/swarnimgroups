upstream swarnim_php {
    least_conn;
    server 10.0.0.11:9000 max_fails=3 fail_timeout=10s;
    server 10.0.0.12:9000 max_fails=3 fail_timeout=10s;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    # Put TLS configuration here.
    root /var/www/electronic;
    index index.php;

    client_max_body_size 8M;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass swarnim_php;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:env|sql|log)$ { deny all; }
}
