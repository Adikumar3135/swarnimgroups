<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070a12">
<title>You're Offline — Swarnim Groups</title>
<style>
:root{color-scheme:dark;--gold:#f5c451;--muted:#9ba5b7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;
font-family:Inter,system-ui,sans-serif;background:#050811;color:#f6f7fb;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 38%,rgba(245,196,81,.10),transparent 28%),radial-gradient(circle at 20% 80%,rgba(93,228,255,.07),transparent 30%)}
.card{position:relative;width:min(520px,calc(100% - 32px));padding:42px 28px;text-align:center;border:1px solid rgba(255,255,255,.1);
border-radius:30px;background:rgba(13,18,30,.82);backdrop-filter:blur(18px);box-shadow:0 35px 100px rgba(0,0,0,.45)}
.logo{width:88px;height:88px;margin:0 auto 22px;border-radius:25px;border:1px solid rgba(245,196,81,.22);background:rgba(245,196,81,.07);display:grid;place-items:center}
.logo img{width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 0 24px rgba(245,196,81,.25))}
.icon{width:76px;height:76px;margin:0 auto 20px;position:relative;border:1px solid rgba(245,196,81,.16);border-radius:50%;display:grid;place-items:center}
.icon:before{content:"";width:29px;height:29px;border:3px solid var(--gold);border-top-color:transparent;border-radius:50%;transform:rotate(-35deg)}
.icon:after{content:"";position:absolute;width:38px;height:3px;background:#f6f7fb;transform:rotate(-28deg);border-radius:3px}
h1{font-size:clamp(1.8rem,6vw,2.7rem);margin:0 0 12px;letter-spacing:-.05em}
p{color:var(--muted);line-height:1.7;margin:0 auto 24px;max-width:410px}
button{border:0;padding:13px 20px;border-radius:14px;background:linear-gradient(135deg,#ffdf7d,#f5c451);font-weight:800;color:#111;cursor:pointer}
.status{display:flex;justify-content:center;gap:8px;align-items:center;color:#7f8b9f;font-size:12px;margin-top:18px}
.status span{width:7px;height:7px;background:#ff7c7c;border-radius:50%;box-shadow:0 0 0 6px rgba(255,124,124,.08)}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><img src="data/Swarnim Logo.png" alt="Swarnim Groups"></div>
  <div class="icon" aria-hidden="true"></div>
  <h1>You're offline</h1>
  <p>Swarnim Groups could not reach the internet right now. Your app is still installed and ready. Reconnect and try again to continue shopping.</p>
  <button type="button" onclick="location.reload()">Try Again</button>
  <div class="status"><span></span> No internet connection</div>
</main>
</body>
</html>
